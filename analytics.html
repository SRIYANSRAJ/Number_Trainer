<!-- ============================================================
     Firebase SDK (compat) — same version pinned by the existing
     Number Trainer app (index.html / index1.html / script.js)
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Chart.js — lightweight, CDN-hosted, used only where a chart genuinely
     helps (trend lines, topic bars, mistake breakdowns). Falls back to
     jsdelivr automatically if cdnjs is blocked (common with ad blockers
     / restrictive networks); charts degrade gracefully either way. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"
        onerror="this.onerror=null; var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'; document.head.appendChild(s);"></script>

<style>
/* ================================================================
   DESIGN TOKENS
   Matched to the existing Number Trainer app (style.css / index1.html):
   deep obsidian background, glass cards, indigo/violet primary,
   emerald=correct, rose=wrong, amber/gold=points & warnings.
   ================================================================ */
:root{
  --bg:            #070a12;
  --bg-soft:       rgba(30,41,59,.65);
  --card:          rgba(15,23,42,.88);
  --card-hover:    rgba(30,41,59,.92);
  --border:        rgba(255,255,255,.14);
  --border-soft:   rgba(255,255,255,.09);
  --primary:       #6366f1;
  --primary-dark:  #4f46e5;
  --purple:        #a855f7;
  --success:       #10b981;
  --error:         #f43f5e;
  --gold:          #f59e0b;
  --gold-light:    #fbbf24;
  --muted:         #94a3b8;
  --muted-2:       #64748b;
  --text:          #f8fafc;
  --shadow:        0 16px 40px rgba(0,0,0,.6), 0 0 25px rgba(99,102,241,.12);
  --radius:        18px;
  --radius-sm:     12px;
  --font-ui:       'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:     'SFMono-Regular','Consolas','Courier New',monospace;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; width:100%; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font-ui); font-size:15px; line-height:1.5; }
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(99,102,241,.20), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(168,85,247,.16), transparent 40%),
    var(--bg);
  min-height:100vh;
}
h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.01em; }
p{ margin:0; }
button{ font-family:inherit; cursor:pointer; }
a{ color:var(--primary); }
::selection{ background:rgba(99,102,241,.35); }
.mono{ font-family:var(--font-mono); }
.hidden{ display:none !important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
::-webkit-scrollbar{ height:8px; width:8px; }
::-webkit-scrollbar-thumb{ background:rgba(148,163,184,.3); border-radius:8px; }

/* ---------- Low-Power AI Loading Animation Pane ---------- */
@keyframes lowPowerPulse {
  0%, 100% { opacity: 0.6; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.04); }
}
@keyframes lowPowerBar {
  0% { width: 0%; }
  40% { width: 60%; }
  80% { width: 90%; }
  100% { width: 98%; }
}
.ai-loading-pane {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 38px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  contain: content;
}
.ai-loading-pulse {
  width: 54px; height: 54px;
  border-radius: 50%;
  background: rgba(99, 102, 241, 0.16);
  border: 1px solid rgba(99, 102, 241, 0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  animation: lowPowerPulse 2.2s ease-in-out infinite;
  will-change: transform, opacity;
}
.ai-loading-bar-wrap {
  width: 100%; max-width: 280px; height: 5px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 6px;
}
.ai-loading-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #a855f7);
  border-radius: 999px;
  animation: lowPowerBar 3.5s ease-out forwards;
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:16px 24px;
  background:rgba(7,10,18,.88); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-soft);
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-mark{
  width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--purple)); font-weight:800; font-size:15px; letter-spacing:.5px;
}
.brand-title{ font-size:16px; font-weight:800; letter-spacing:.6px; }
.brand-sub{ font-size:12.5px; color:var(--muted); letter-spacing:.4px; }
.topbar-right{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.status-dot{ font-size:12px; font-weight:700; padding:6px 12px; border-radius:20px; border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px; }
.status-dot.live{ color:var(--success); border-color:rgba(16,185,129,.35); background:rgba(16,185,129,.08); }
.status-dot.ok{ color:var(--muted); }
.status-dot.warn{ color:var(--gold); border-color:rgba(245,158,11,.35); background:rgba(245,158,11,.08); }
.status-dot.err{ color:var(--error); border-color:rgba(244,63,94,.35); background:rgba(244,63,94,.08); }
.user-chip{ display:flex; align-items:center; gap:10px; padding:6px 14px 6px 8px; border-radius:20px; background:var(--bg-soft); border:1px solid var(--border); font-size:13.5px; font-weight:600; }
.user-avatar{ width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--gold-light),var(--gold)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#1a1200; }
.mode-badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; letter-spacing:.4px; text-transform:uppercase; }
.mode-badge.self{ background:rgba(99,102,241,.18); color:#c7d2fe; }
.mode-badge.admin{ background:rgba(245,158,11,.18); color:var(--gold-light); }
.icon-btn{
  background:var(--bg-soft); color:var(--text); border:1px solid var(--border); border-radius:10px;
  padding:9px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:background .15s,border-color .15s;
}
.icon-btn:hover{ background:var(--card-hover); border-color:rgba(255,255,255,.22); }
.icon-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

/* ---------- Tab nav ---------- */
.tab-nav{
  display:flex; gap:8px; padding:12px 22px; overflow-x:auto; scrollbar-width:thin;
  background:rgba(11,15,25,.8); border-bottom:1px solid var(--border-soft); position:sticky; top:75px; z-index:35;
}
.tab-btn{
  flex:0 0 auto; background:transparent; border:1px solid transparent; color:var(--muted);
  padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.tab-btn:hover{ color:var(--text); background:var(--bg-soft); }
.tab-btn[aria-selected="true"]{ color:var(--text); background:rgba(99,102,241,.2); border-color:rgba(99,102,241,.5); font-weight:700; }

/* ---------- Layout ---------- */
main{ max-width:1360px; margin:0 auto; padding:26px 22px 80px; }
.panel{ display:flex; flex-direction:column; gap:20px; animation:fadeIn .25s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }
.section-title{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.section-title h2{ font-size:22px; }
.section-sub{ color:var(--muted); font-size:13.5px; margin-top:4px; }

/* ---------- Cards / Glass ---------- */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px;
}
.card.tight{ padding:16px; }

/* ---------- KPI grid ---------- */
.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.kpi-card{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px;
  position:relative; overflow:hidden;
}
.kpi-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--primary),var(--purple)); }
.kpi-card.gold::before{ background:linear-gradient(90deg,var(--gold-light),var(--gold)); }
.kpi-card.good::before{ background:linear-gradient(90deg,#34d399,var(--success)); }
.kpi-card.bad::before{ background:linear-gradient(90deg,#fb7185,var(--error)); }
.kpi-label{ font-size:12px; color:var(--muted); letter-spacing:.8px; text-transform:uppercase; font-weight:700; }
.kpi-value{ font-size:28px; font-weight:800; margin-top:8px; font-family:var(--font-mono); }
.kpi-trend{ font-size:12.5px; margin-top:6px; color:var(--muted); }
.kpi-trend.up{ color:var(--success); }
.kpi-trend.down{ color:var(--error); }

/* ---------- Grid layouts ---------- */
.grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:900px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; border-radius:var(--radius-sm); border:1px solid var(--border-soft); }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width:640px; }
thead th{
  text-align:left; padding:12px 14px; background:rgba(30,41,59,.6); color:var(--muted);
  font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; font-weight:700; position:sticky; top:0;
  border-bottom:1px solid var(--border-soft); cursor:pointer; user-select:none; white-space:nowrap;
}
thead th:hover{ color:var(--text); }
thead th .sort-ind{ opacity:.7; font-size:10px; margin-left:4px; }
tbody td{ padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.05); white-space:nowrap; }
tbody tr{ transition:background .12s; }
tbody tr.clickable{ cursor:pointer; }
tbody tr.clickable:hover{ background:rgba(99,102,241,.1); }
.pill{ display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:20px; font-size:12px; font-weight:700; }
.pill.correct{ background:rgba(16,185,129,.16); color:#6ee7b7; }
.pill.wrong{ background:rgba(244,63,94,.16); color:#fda4af; }
.pill.neutral{ background:rgba(148,163,184,.16); color:var(--muted); }
.pill.gold{ background:rgba(245,158,11,.16); color:var(--gold-light); }

/* ---------- Filters ---------- */
.filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.filter-bar input[type="text"], .filter-bar input[type="date"], .filter-bar select{
  background:var(--bg-soft); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:10px 14px; font-size:14px; font-family:inherit;
}
.filter-bar input[type="text"]{ min-width:220px; }
.filter-bar label{ font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:5px; font-weight:600; }
.chip-toggle{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg-soft); color:var(--muted); font-size:13px; font-weight:600; }
.chip[aria-pressed="true"]{ background:rgba(99,102,241,.2); color:var(--text); border-color:rgba(99,102,241,.5); }

/* ---------- Empty / loading / error states ---------- */
.empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:48px 18px; text-align:center; color:var(--muted); }
.empty-state .emoji{ font-size:36px; }
.empty-state h3{ color:var(--text); font-size:16px; }
.empty-state p{ font-size:13.5px; max-width:380px; }
.gate{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:16px; text-align:center; padding:20px; }
.skeleton{ background:linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 37%, rgba(255,255,255,.04) 63%); background-size:400% 100%; animation:shimmer 1.4s infinite; border-radius:10px; }
@keyframes shimmer{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }
.skeleton-kpi{ height:86px; border-radius:14px; }
.skeleton-row{ height:38px; margin-bottom:6px; border-radius:8px; }

/* ---------- Insight cards ---------- */
.insight{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:12px; background:rgba(99,102,241,.08); border:1px solid rgba(99,102,241,.22); font-size:14px; line-height:1.5; }
.insight .tag{ flex:0 0 auto; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; padding:3px 8px; border-radius:6px; background:rgba(99,102,241,.22); color:#c7d2fe; }
.insight.warn{ background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.25); }
.insight.warn .tag{ background:rgba(245,158,11,.25); color:var(--gold-light); }
.insight.na{ background:rgba(148,163,184,.08); border-color:var(--border-soft); color:var(--muted); }

/* ---------- Struggle badges ---------- */
.struggle-badge{ font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:8px; letter-spacing:.4px; }
.struggle-badge.strong{ background:rgba(16,185,129,.16); color:#6ee7b7; }
.struggle-badge.average{ background:rgba(99,102,241,.16); color:#c7d2fe; }
.struggle-badge.needs{ background:rgba(245,158,11,.16); color:var(--gold-light); }
.struggle-badge.critical{ background:rgba(244,63,94,.16); color:#fda4af; }

/* ---------- Heatmap ---------- */
.heatmap{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,16px); gap:4px; overflow-x:auto; padding:6px 2px 12px; }
.heat-cell{ width:16px; height:16px; border-radius:4px; background:rgba(148,163,184,.1); cursor:pointer; }
.heat-cell:hover{ outline:1.5px solid var(--primary); }
.heat-legend{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin-top:6px; }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; background:rgba(3,5,10,.75); backdrop-filter:blur(4px); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
.modal-card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); max-width:640px; width:100%; padding:24px; animation:fadeIn .18s ease; }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
.modal-close{ background:var(--bg-soft); border:1px solid var(--border); color:var(--text); border-radius:9px; width:32px; height:32px; font-size:15px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition:all 0.15s ease; }
.modal-close:hover{ background:var(--error); border-color:var(--error); color:#fff; }
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; font-size:14px; }
.detail-grid .full{ grid-column:1/-1; }
.detail-k{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:700; margin-bottom:4px; }
.detail-v{ font-family:var(--font-mono); font-size:14.5px; }

/* ---------- Toast ---------- */
.toast-root{ position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:10px; }
.toast{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 18px; font-size:13.5px; box-shadow:var(--shadow); animation:fadeIn .2s ease; max-width:340px; }
.toast.success{ border-color:rgba(16,185,129,.4); }
.toast.error{ border-color:rgba(244,63,94,.4); }

/* ---------- Buttons ---------- */
.btn{ background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:700; }
.btn.ghost{ background:var(--bg-soft); color:var(--text); border:1px solid var(--border); }
.btn.gold{ background:linear-gradient(135deg,var(--gold-light),var(--gold)); color:#1a1200; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }

/* ---------- Pagination ---------- */
.pager{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:10px; font-size:13px; color:var(--muted); }

/* ---------- Chart container ---------- */
.chart-box{ position:relative; height:270px; }
.chart-box.sm{ height:200px; }

/* ---------- Data-scope note ---------- */
.scope-note{ font-size:12.5px; color:var(--muted-2); border-top:1px dashed var(--border-soft); padding-top:10px; margin-top:6px; }
.scope-note b{ color:var(--muted); }

/* ---------- Print ---------- */
.print-only{ display:none; }
@media print{
  .topbar,.tab-nav,.filter-bar,.btn-row,.icon-btn,.pager,#toastRoot,#modalRoot{ display:none !important; }
  body{ background:#fff !important; color:#111 !important; }
  .print-only{ display:block !important; }
  main > .panel:not(#panel-reports){ display:none !important; }
  .card{ box-shadow:none !important; border-color:#ccc !important; background:#fff !important; color:#111 !important; }
}

/* ---------- Responsive & AI Report Hero Enhancements ---------- */
.ai-report-hero {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(99, 102, 241, 0.35);
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
  margin-bottom: 20px;
  padding: 24px;
  border-radius: var(--radius);
}
.ai-report-hero-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.ai-report-hero-text {
  flex: 1;
}
.ai-report-grade-badge {
  width: 84px;
  height: 84px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 900;
  flex-shrink: 0;
}

@media (max-width: 768px) {
  .topbar {
    padding: 12px 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .topbar-right {
    gap: 8px;
    width: 100%;
    justify-content: flex-start;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .tab-nav {
    top: 0;
    position: relative;
    padding: 8px 14px;
    gap: 6px;
  }
  .tab-btn {
    padding: 8px 14px;
    font-size: 13px;
  }
}

@media (max-width: 640px) {
  .topbar {
    padding: 10px 12px;
    gap: 8px;
  }
  .brand-title {
    font-size: 14px;
  }
  .brand-sub {
    display: none;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    font-size: 13px;
    border-radius: 10px;
  }
  .topbar-right {
    gap: 6px;
  }
  .status-dot {
    padding: 4px 10px;
    font-size: 11.5px;
  }
  .user-chip {
    padding: 4px 10px 4px 6px;
    font-size: 12px;
  }
  .user-avatar {
    width: 22px;
    height: 22px;
    font-size: 10.5px;
  }
  .icon-btn {
    padding: 7px 11px;
    font-size: 12px;
    border-radius: 8px;
  }
  main {
    padding: 14px 10px 70px;
  }
  .kpi-value {
    font-size: 21px;
  }
  .detail-grid {
    grid-template-columns: 1fr;
  }

  /* Gemini Report Mobile Card & Grade Letter Styling */
  .ai-report-hero {
    padding: 16px;
  }
  .ai-report-hero-inner {
    flex-direction: column-reverse;
    align-items: flex-start;
    gap: 14px;
  }
  .ai-report-grade-badge {
    align-self: flex-start;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    font-size: 28px;
  }
  .ai-report-hero-text h2 {
    font-size: 19px !important;
  }
  .ai-report-hero-text p {
    font-size: 13px !important;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index1.html" class="brand" style="text-decoration:none; color:inherit;" title="Return to Number Trainer">

<script>
'use strict';
/* ================================================================
   CONFIG
   Loads dynamic Firebase configuration from /api/firebase-config or Cloudflare proxy.
   No new collections, no schema changes.
   ================================================================ */

const CFG = {
  collection: 'userStats',          // sole existing collection — one doc per uid
  historyCap: 200,                  // existing app trims history client-side to last 200 entries
  sessionGapMs: 20 * 60 * 1000,     // 20 min gap = new derived session
  studentsPageSize: 25,
  minSampleForTrend: 6,             // don't call trends on tiny datasets
  minSampleForStruggle: 3
};

const GEMINI_STAR_SVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px; display:inline-block; margin-right:4px;" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gemini-spark-grad)"/>
  <defs>
    <linearGradient id="gemini-spark-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>

      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>`;

const GEMINI_STAR_LARGE_SVG = `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" style="display:inline-block; margin-bottom:12px;" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gemini-lg-grad)"/>
  <defs>
    <linearGradient id="gemini-lg-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>`;

const TABS = [
  { id:'overview',    label:'Overview' },
  { id:'aiReport',    label:'✦ Gemini AI Diagnostic' },
  { id:'cohortAi',    label:'✦ Class Cohort AI', adminOnly:true },
  { id:'students',    label:'Students', adminOnly:true },
  { id:'performance', label:'Performance' },
  { id:'questions',   label:'Questions' },
  { id:'mistakes',    label:'Mistakes' },
  { id:'topics',      label:'Topics' },
  { id:'timeline',    label:'Timeline' },
  { id:'sessions',    label:'Sessions' },
  { id:'leaderboard', label:'Leaderboard' },
  { id:'reports',     label:'Reports' }
];

/* ================================================================
   STATE
   ================================================================ */
const state = {
  fbApp:null, db:null, auth:null,
  user:null, isAdmin:false,
  activeTab:'overview',
  connection:'connecting',    // connecting | connected | offline | reconnecting
  live:false,
  selfDoc:null,                // raw userStats doc for the signed-in user
  viewedUid:null, viewedDoc:null, viewedIsSelf:true,
  attempts:[], mistakes:[], sessions:[],
  students:[], studentsCursor:null, studentsDone:false, studentsLoading:false,
  filters:{ search:'', dateRange:'all', topic:'all', result:'all', type:'all', custom:{from:null,to:null} },
  sort:{ table:null, key:null, dir:'desc' },
  charts:{},
  unsubSelf:null,
  searchDebounce:null
};

/* ================================================================
   UTILITIES
   ================================================================ */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function fmtNum(n, d){ if(n==null || isNaN(n)) return 'N/A'; return Number(n).toLocaleString(undefined,{maximumFractionDigits:d==null?0:d}); }
function fmtPct(n){ if(n==null || isNaN(n)) return 'N/A'; return n.toFixed(1)+'%'; }
function fmtSec(n){ if(n==null || isNaN(n)) return 'N/A'; return n.toFixed(1)+'s'; }
function fmtDur(ms){
  if(ms==null || isNaN(ms) || ms<0) return 'N/A';
  const s = Math.round(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m ${sec}s`;
  return `${sec}s`;
}
function toast(msg, type){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast'+(type?(' '+type):'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 4200);
}
function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}
function safeParseDate(dateStr, timeStr){
  if(!dateStr) return null;
  try{
    const d = new Date(`${dateStr} ${timeStr||''}`.trim());
    if(!isNaN(d.getTime())) return d.getTime();
  }catch(e){}
  return null;
}
function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportRowsCSV(rows, headers, filename){
  if(!rows.length){ toast('Nothing to export yet.'); return; }
  const lines = [headers.map(h=>csvEscape(h.label)).join(',')];
  rows.forEach(r=>{ lines.push(headers.map(h=>csvEscape(h.get(r))).join(',')); });
  downloadBlob(lines.join('\n'), filename, 'text/csv;charset=utf-8;');
  toast('CSV exported.', 'success');
}
function exportRowsJSON(rows, filename){
  if(!rows.length){ toast('Nothing to export yet.'); return; }
  downloadBlob(JSON.stringify(rows, null, 2), filename, 'application/json;charset=utf-8;');
  toast('JSON exported.', 'success');
}

/* ================================================================
   FIREBASE INIT
   ================================================================ */
async function initFirebase(){
  try{
    if (!firebase.apps.length) {
      let config = window.FIREBASE_CONFIG;
      if (!config || !config.apiKey) {
        try {
          const isGitHubPages = window.location.hostname.includes('github.io');
          const configUrl = isGitHubPages ? 'https://gemini-proxy.sriyansraj02.workers.dev/firebase-config' : '/api/firebase-config';
          const res = await fetch(configUrl);
          if (res.ok) {
            const fetched = await res.json();
            if (fetched && fetched.apiKey) config = fetched;
          }
        } catch (e) {
          console.warn("Could not fetch Firebase config:", e);
        }
      }
      
      if (!config || !config.apiKey) {
        throw new Error("Missing Firebase configuration.");
      }
      state.fbApp = firebase.initializeApp(config);
    } else {
      state.fbApp = firebase.app();
    }
    state.auth = firebase.auth();
    state.db = firebase.firestore();
    return true;
  }catch(err){
    showErrorGate('Could not start Firebase', err && err.message ? err.message : String(err));
    return false;
  }
}

window.addEventListener('online', ()=> setConnection(state.user ? 'connected' : 'connecting'));
window.addEventListener('offline', ()=> setConnection('offline'));

function setConnection(status){
  state.connection = status;
  const dot = $('#connDot');
  if(!dot) return;
  dot.classList.remove('ok','warn','err','live');
  const map = {
    connecting:  { cls:'ok',   text:'● Connecting…' },
    connected:   { cls:'ok',   text:'● Connected' },
    reconnecting:{ cls:'warn', text:'● Reconnecting…' },
    offline:     { cls:'err',  text:'● Offline' }
  };
  const m = map[status] || map.connecting;
  dot.classList.add(m.cls);
  dot.textContent = m.text;
}

function setLive(on){
  state.live = on;
  const el = $('#liveDot');
  if(!el) return;
  el.classList.toggle('hidden', !on);
}

/* ================================================================
   AUTH
   ================================================================ */
async function bootstrap(){
  if(!(await initFirebase())) return;
  setConnection('connecting');

  setTimeout(()=>{
    if(!isChartJsReady()){
      toast('Charts library failed to load — check for an ad blocker or firewall blocking cdnjs.cloudflare.com / cdn.jsdelivr.net. Tables and numbers still work normally.', 'error');
    }
  }, 2500);

  state.auth.onAuthStateChanged(async (user)=>{
    if(!user){
      hideAllGates();
      $('#authGate').classList.remove('hidden');
      $('#tabNav').classList.add('hidden');
      $('#userChip').classList.add('hidden');
      $('#refreshBtn').classList.add('hidden');
      $('#signOutBtn').classList.add('hidden');
      return;
    }
    state.user = user;
    state.viewedUid = user.uid;
    state.viewedIsSelf = true;
    setUserChip(user);
    $('#refreshBtn').classList.remove('hidden');
    $('#signOutBtn').classList.remove('hidden');

    try{
      state.isAdmin = await checkAdminAuthorization(user);
    }catch(e){
      console.warn('Admin check failed:', e);
      state.isAdmin = false; // fail closed — never assume admin on error
    }

    // Update user chip AFTER state.isAdmin is determined
    setUserChip(user);

    // URL param convenience for admins only; students are forced to view themselves
    const params = new URLSearchParams(window.location.search);
    const requestedUid = params.get('student');
    if(state.isAdmin && requestedUid){
      state.viewedUid = requestedUid;
      state.viewedIsSelf = requestedUid === user.uid;
    } else {
      state.viewedUid = user.uid;
      state.viewedIsSelf = true;
    }

    renderTabNav();
    await loadInitialData();
  });
}

function setUserChip(user){
  const chip = $('#userChip');
  const name = user.displayName || (user.email ? user.email.split('@')[0] : 'Learner');
  chip.classList.remove('hidden');
  chip.innerHTML = `
    <span class="user-avatar" aria-hidden="true">${esc(initials(name))}</span>
    <span>${esc(name)}</span>
    <span class="mode-badge ${state.isAdmin?'admin':'self'}">${state.isAdmin?'Admin':'Student'}</span>
  `;
}

/**
 * Admin/teacher authorization.
 * Checks for:
 *  1. Custom Auth claim admin === true
 *  2. Document existence in admins/{uid} (matches user's Firestore Security Rules)
 */
async function checkAdminAuthorization(user){
  try{
    const tokenResult = await user.getIdTokenResult();
    if(tokenResult && tokenResult.claims && tokenResult.claims.admin === true) {
      console.log('[NT Analytics] Admin verified via Auth custom claim.');
      return true;
    }
    console.debug('[NT Analytics] No admin custom claim on this ID token.');
  }catch(e){ console.debug('[NT Analytics] Custom claim check failed:', e.message); }

  try{
    const snap = await state.db.collection('admins').doc(user.uid).get();
    if(snap.exists) {
      const data = snap.data() || {};
      if(data.isAdmin !== false) {
        console.log('[NT Analytics] Admin verified via admins/'+user.uid+' document existence.');
        return true;
      }
    }
    console.debug('[NT Analytics] admins/'+user.uid+' doc missing or explicitly disabled. exists=', snap.exists);
  }catch(e){
    console.debug('[NT Analytics] admins/'+user.uid+' read failed:', e.code||'', e.message);
  }

  return false;
}

function signOut(){
  if(state.unsubSelf){ state.unsubSelf(); state.unsubSelf = null; }
  state.auth.signOut().then(()=>{ window.location.replace('index.html'); }).catch(()=>{ window.location.replace('index.html'); });
}

/* ================================================================
   FIRESTORE ACCESS LAYER
   ================================================================ */
function watchOwnDoc(uid){
  if(state.unsubSelf) state.unsubSelf();
  setConnection('connecting');
  state.unsubSelf = state.db.collection(CFG.collection).doc(uid).onSnapshot(
    (snap)=>{
      setConnection('connected');
      setLive(state.viewedIsSelf); // the LIVE dot reflects the currently VIEWED student, not just background sync
      state.selfDoc = snap.exists ? snap.data() : null;
      if(state.viewedIsSelf){
        state.viewedDoc = state.selfDoc;
        onViewedDocChanged();
      }
    },
    (err)=>{
      setLive(false);
      setConnection(navigator.onLine ? 'reconnecting' : 'offline');
      console.warn('Realtime listener error:', err.message);
    }
  );
}

async function fetchStudentDoc(uid){
  const snap = await state.db.collection(CFG.collection).doc(uid).get();
  return snap.exists ? snap.data() : null;
}

async function fetchStudentsPage(reset){
  if(reset){ state.students = []; state.studentsCursor = null; state.studentsDone = false; }
  if(state.studentsDone || state.studentsLoading) return;
  state.studentsLoading = true;
  try{
    let q = state.db.collection(CFG.collection).orderBy('points','desc').limit(CFG.studentsPageSize);
    if(state.studentsCursor) q = q.startAfter(state.studentsCursor);
    const snap = await q.get();
    if(snap.empty || snap.docs.length < CFG.studentsPageSize) state.studentsDone = true;
    snap.docs.forEach(d=>{
      const data = d.data();
      state.students.push(normalizeStudentSummary(data, d.id));
    });
    if(snap.docs.length) state.studentsCursor = snap.docs[snap.docs.length-1];
  }catch(err){
    toast('Could not load students: '+(err.message||err), 'error');
  }finally{
    state.studentsLoading = false;
  }
}

async function fetchStudentByEmail(email){
  try{
    const snap = await state.db.collection(CFG.collection).where('email','==', email).limit(1).get();
    if(snap.empty) return null;
    return normalizeStudentSummary(snap.docs[0].data(), snap.docs[0].id);
  }catch(err){
    toast('Lookup failed: '+(err.message||err), 'error');
    return null;
  }
}

/* ================================================================
   DATA NORMALIZATION
   Maps the ACTUAL existing schema (userStats/{uid}: points, maxStreak,
   totalSolved, errors, conversions, arithmetic, accuracy, history[],
   errorNotebook[]) into a stable shape the rest of the dashboard uses.
   Nothing here invents fields the app doesn't record.
   ================================================================ */
function normalizeStudentSummary(raw, uid){
  raw = raw || {};
  let totalSolved = Number(raw.totalSolved || 0);
  let errors = Number(raw.errors || 0);
  let maxS = Math.max(Number(raw.maxStreak || 0), Number(raw.currentStreak || 0), Number(raw.streak || 0));
  let curS = Number(raw.currentStreak || raw.streak || 0);
  let points = Number(raw.points || 0);
  let convs = Number(raw.conversions || 0);
  let arith = Number(raw.arithmetic || 0);

  if ((typeof state !== 'undefined' && state.user && uid === state.user.uid) || (typeof state !== 'undefined' && state.viewedIsSelf)) {
    const localMax = parseInt(localStorage.getItem('numSysMaxStreak') || '0', 10);
    const localCur = parseInt(localStorage.getItem('numSysCurrentStreak') || '0', 10);
    const localPts = parseInt(localStorage.getItem('numSysPoints') || '0', 10);
    const localSolved = parseInt(localStorage.getItem('numSysTotalSolved') || '0', 10);
    const localErrs = parseInt(localStorage.getItem('numSysErrors') || '0', 10);
    const localConvs = parseInt(localStorage.getItem('numSysConversions') || '0', 10);
    const localArith = parseInt(localStorage.getItem('numSysArithmetic') || '0', 10);

    maxS = Math.max(maxS, localMax, localCur);
    curS = Math.max(curS, localCur);
    points = Math.max(points, localPts);
    totalSolved = Math.max(totalSolved, localSolved);
    errors = Math.max(errors, localErrs);
    convs = Math.max(convs, localConvs);
    arith = Math.max(arith, localArith);
  }

  const accuracy = totalSolved > 0 ? ((totalSolved - errors) / totalSolved * 100) : null;

  return {
    uid,
    name: raw.name || (raw.email ? raw.email.split('@')[0] : 'Unknown'),
    email: raw.email || 'N/A',
    points,
    maxStreak: maxS,
    currentStreak: curS,
    totalSolved,
    errors,
    correct: Math.max(0, totalSolved - errors),
    conversions: convs,
    arithmetic: arith,
    accuracy,
    updatedAtMs: raw.updatedAt && typeof raw.updatedAt.toMillis === 'function' ? raw.updatedAt.toMillis() : null,
    historyCount: Array.isArray(raw.history) ? raw.history.length : 0,
    _raw: raw
  };
}

function normBaseName(b){
  b = String(b||'').toLowerCase();
  if(b.startsWith('bin')) return 'Binary';
  if(b.startsWith('oct')) return 'Octal';
  if(b.startsWith('dec')) return 'Decimal';
  if(b.startsWith('hex')) return 'Hex';
  return b ? (b[0].toUpperCase()+b.slice(1)) : 'Unknown';
}

const OP_NAMES = { '+':'Addition', '-':'Subtraction', '\u00d7':'Multiplication', '*':'Multiplication', '\u00f7':'Division', '/':'Division' };

/**
 * Derives a topic/subtype label from the free-text "problem" string the
 * app already stores (e.g. "Binary ➔ Decimal (101101)" or
 * "Hexadecimal (1A + 0F)"). This is a DERIVED classification, not a
 * stored field — the app has no category/topic column.
 */
function deriveTopic(type, problem){
  problem = problem || '';
  if(type === 'Conversion'){
    const m = problem.match(/(Binary|Octal|Decimal|Hex(?:adecimal)?)\s*(?:\u2794|\u2192|->|➔)\s*(Binary|Octal|Decimal|Hex(?:adecimal)?)/i);
    if(m) return { topic: `${normBaseName(m[1])} \u2192 ${normBaseName(m[2])}`, subtype:'Base Conversion' };
    return { topic:'Conversion (unspecified)', subtype:'Base Conversion' };
  }
  const baseM = problem.match(/(Binary|Octal|Decimal|Hex(?:adecimal)?)/i);
  const opM = problem.match(/[+\-\u00d7\u00f7*/]/);
  const opName = OP_NAMES[opM ? opM[0] : ''] || 'Arithmetic';
  const baseName = baseM ? normBaseName(baseM[1]) : 'Number';
  return { topic:`${baseName} ${opName}`, subtype:opName };
}

/**
 * Normalizes one raw history entry into a full attempt record.
 * Fields the app does not store (questionId, difficulty, sessionId,
 * hintsUsed, retryCount, startedAt vs submittedAt as distinct epoch
 * timestamps) are explicitly set to null / 'N/A' rather than guessed.
 */
function normalizeAttempt(raw, ctx){
  raw = raw || {};
  const topicInfo = deriveTopic(raw.type, raw.problem);
  const ts = safeParseDate(raw.date, raw.time);
  return {
    attemptId: raw.id != null ? String(raw.id) : null,
    uid: ctx.uid,
    studentName: ctx.name,
    dateStr: raw.date || null,
    timeStr: raw.time || null,
    timestampMs: ts,                 // null if the browser couldn't parse the locale date/time strings
    category: raw.type === 'Conversion' ? 'Conversion' : 'Arithmetic',
    topic: topicInfo.topic,
    subtype: topicInfo.subtype,
    question: raw.problem || 'N/A',
    studentAnswer: (raw.userAnswer==null || raw.userAnswer==='') ? 'N/A' : String(raw.userAnswer),
    correctAnswer: (raw.correctAnswer==null || raw.correctAnswer==='') ? 'N/A' : String(raw.correctAnswer),
    isCorrect: !!raw.isCorrect,
    timeTaken: typeof raw.timeSeconds === 'number' ? raw.timeSeconds : null,
    points: typeof raw.pointsDelta === 'number' ? raw.pointsDelta : null,
    difficulty: 'N/A',               // not recorded per-attempt by the existing app
    questionId: 'N/A',               // questions are generated on the fly, no persisted ID
    sessionId: null                  // filled in by deriveSessions()
  };
}

/** Normalizes an error-notebook entry (conversion mistakes only — the
 *  app's own targeted-retry feature). This has a REAL epoch timestamp,
 *  unlike history entries, so it's useful for repeat-mistake timing. */
function normalizeNotebookEntry(raw, ctx){
  raw = raw || {};
  const sB = normBaseName({2:'Binary',8:'Octal',10:'Decimal',16:'Hex'}[raw.sB] || raw.sB);
  const tB = normBaseName({2:'Binary',8:'Octal',10:'Decimal',16:'Hex'}[raw.tB] || raw.tB);
  return {
    attemptId: raw.id || null,
    uid: ctx.uid,
    studentName: ctx.name,
    timestampMs: typeof raw.timestamp === 'number' ? raw.timestamp : null,
    category: 'Conversion',
    topic: `${sB} \u2192 ${tB}`,
    question: raw.qStr || 'N/A',
    studentAnswer: raw.userEntered==null ? 'N/A' : String(raw.userEntered),
    correctAnswer: raw.aStr==null ? 'N/A' : String(raw.aStr),
    isCorrect: false,
    source: 'errorNotebook'
  };
}

/** Best-effort, clearly-labeled pattern detection. Never claims to know
 *  WHY the student was wrong — only compares the two stored answers. */
function detectPattern(attempt){
  if(attempt.isCorrect) return null;
  const sa = String(attempt.studentAnswer||'').trim().toUpperCase();
  const ca = String(attempt.correctAnswer||'').trim().toUpperCase();
  if(!sa || sa === 'EMPTY' || sa === 'N/A') return 'No answer submitted (time expired or skipped).';
  if(sa === ca) return null; // shouldn't happen if isCorrect is false, but guard anyway
  if(sa.length !== ca.length) return 'Possible digit-count / format mismatch.';
  const numSa = parseFloat(sa), numCa = parseFloat(ca);
  if(!isNaN(numSa) && !isNaN(numCa)){
    const diff = Math.abs(numSa - numCa);
    if(diff > 0 && diff <= 2) return 'Off-by-a-small-amount — possible rounding, carry, or boundary slip.';
  }
  let sameDigits = true;
  for(const ch of sa){ if(!ca.includes(ch)){ sameDigits = false; break; } }
  if(sameDigits && sa.length === ca.length) return 'Same digits, different order/value — possible digit-position (place value) slip.';
  return 'Unclassified — insufficient data for a specific pattern.';
}

/* ================================================================
   ANALYTICS ENGINE
   Pure functions over normalized attempts. Every function here is
   explicit about minimum-sample requirements so the dashboard never
   draws a strong conclusion ("declining", "critical") from noise.
   ================================================================ */
function buildAttemptsForDoc(doc, uid, name){
  let history = doc && Array.isArray(doc.history) ? doc.history : [];
  let notebook = doc && Array.isArray(doc.errorNotebook) ? doc.errorNotebook : [];

  // If viewing self or doc has no history, merge/fallback with local localStorage data
  if (state.viewedIsSelf) {
    try {
      const localHist = JSON.parse(localStorage.getItem('numSysHistory') || '[]');
      if (Array.isArray(localHist) && localHist.length) {
        // Merge history without duplicating entries by stringifying problem + time/date
        const seen = new Set(history.map(h => `${h.problem}_${h.timeSeconds}_${h.date||''}_${h.time||''}`));
        localHist.forEach(lh => {
          const key = `${lh.problem}_${lh.timeSeconds}_${lh.date||''}_${lh.time||''}`;
          if (!seen.has(key)) {
            seen.add(key);
            history.push(lh);
          }
        });
      }
      const localNb = JSON.parse(localStorage.getItem('numSysErrorNotebook') || '[]');
      if (Array.isArray(localNb) && localNb.length) {
        const seenNb = new Set(notebook.map(n => n.id || `${n.sB}_${n.tB}_${n.qStr}`));
        localNb.forEach(ln => {
          const key = ln.id || `${ln.sB}_${ln.tB}_${ln.qStr}`;
          if (!seenNb.has(key)) {
            seenNb.add(key);
            notebook.push(ln);
          }
        });
      }
    } catch (e) {
      console.warn('Local storage fallback error in analytics:', e);
    }
  }

  if (!doc && !history.length && !notebook.length) return { attempts:[], mistakes:[] };

  const ctx = { uid, name: name || (doc ? doc.name : null) || 'Learner' };
  const attempts = history.map(h=>normalizeAttempt(h, ctx))
    .sort((a,b)=>{
      if(a.timestampMs!=null && b.timestampMs!=null) return b.timestampMs - a.timestampMs;
      return 0; // preserve original (already newest-first) order when unparseable
    });
  const wrongFromHistory = attempts.filter(a=>!a.isCorrect);
  const notebookMistakes = notebook.map(n=>normalizeNotebookEntry(n, ctx));
  return { attempts, mistakes:[...wrongFromHistory, ...notebookMistakes] };
}

function deriveSessions(attempts){
  const timed = attempts.filter(a=>a.timestampMs!=null).sort((a,b)=>a.timestampMs-b.timestampMs);
  if(!timed.length) return [];
  const sessions = [];
  let cur = [timed[0]];
  for(let i=1;i<timed.length;i++){
    const gap = timed[i].timestampMs - timed[i-1].timestampMs;
    if(gap > CFG.sessionGapMs){
      sessions.push(cur);
      cur = [timed[i]];
    } else {
      cur.push(timed[i]);
    }
  }
  sessions.push(cur);
  return sessions.map((list, idx)=>{
    const correct = list.filter(a=>a.isCorrect).length;
    const points = list.reduce((s,a)=>s+(a.points||0),0);
    return {
      sessionId: `Derived Session #${idx+1}`,
      derived: true,
      start: list[0].timestampMs,
      end: list[list.length-1].timestampMs,
      durationMs: list[list.length-1].timestampMs - list[0].timestampMs,
      questions: list.length,
      correct, wrong: list.length-correct,
      accuracy: list.length ? (correct/list.length*100) : null,
      points,
      attempts: list.slice().reverse() // newest-first for display
    };
  }).reverse(); // most recent session first
}

function computeSelfKPIs(summary, attempts){
  const times = attempts.map(a=>a.timeTaken).filter(t=>typeof t==='number');
  const avgTime = times.length ? times.reduce((a,b)=>a+b,0)/times.length : null;
  const correctTimes = attempts.filter(a=>a.isCorrect).map(a=>a.timeTaken).filter(t=>typeof t==='number');
  const wrongTimes = attempts.filter(a=>!a.isCorrect).map(a=>a.timeTaken).filter(t=>typeof t==='number');

  let maxStreakFromHist = summary.maxStreak || 0;
  if (attempts && attempts.length) {
    let cur = 0, peak = 0;
    const chrono = attempts.slice().reverse();
    chrono.forEach(a => {
      if (a.isCorrect) { cur++; if (cur > peak) peak = cur; }
      else { cur = 0; }
    });
    maxStreakFromHist = Math.max(maxStreakFromHist, peak);
  }

  return {
    totalSolved: summary.totalSolved,
    correct: summary.correct,
    wrong: summary.errors,
    accuracy: summary.accuracy,
    points: summary.points,
    maxStreak: maxStreakFromHist,
    avgTime,
    fastestCorrect: correctTimes.length ? Math.min(...correctTimes) : null,
    slowestCorrect: correctTimes.length ? Math.max(...correctTimes) : null,
    fastestWrong: wrongTimes.length ? Math.min(...wrongTimes) : null,
    slowestWrong: wrongTimes.length ? Math.max(...wrongTimes) : null,
    recentLoadedCount: attempts.length
  };
}

function groupByTopic(attempts){
  const map = new Map();
  attempts.forEach(a=>{
    if(!map.has(a.topic)) map.set(a.topic, []);
    map.get(a.topic).push(a);
  });
  return map;
}

function computeTopicTable(attempts){
  const overallTimes = attempts.map(a=>a.timeTaken).filter(t=>typeof t==='number');
  const overallAvg = overallTimes.length ? overallTimes.reduce((a,b)=>a+b,0)/overallTimes.length : null;
  const grouped = groupByTopic(attempts);
  const rows = [];
  grouped.forEach((list, topic)=>{
    const wrong = list.filter(a=>!a.isCorrect).length;
    const correct = list.length - wrong;
    const times = list.map(a=>a.timeTaken).filter(t=>typeof t==='number');
    const avgTime = times.length ? times.reduce((a,b)=>a+b,0)/times.length : null;
    const struggle = list.length >= CFG.minSampleForStruggle
      ? computeStruggleScore(list, overallAvg) : null;
    rows.push({
      topic, attempts:list.length, correct, wrong,
      accuracy: list.length ? (correct/list.length*100) : null,
      avgTime, struggleScore: struggle,
      struggleLabel: struggleLabel(struggle),
      sampleTooSmall: list.length < CFG.minSampleForStruggle
    });
  });
  return rows.sort((a,b)=> (b.struggleScore||0) - (a.struggleScore||0));
}

function computeStruggleScore(list, overallAvgTime){
  const n = list.length;
  const wrong = list.filter(a=>!a.isCorrect).length;
  const errorRate = n ? wrong/n : 0;
  const errorContribution = errorRate * 50;

  const times = list.map(a=>a.timeTaken).filter(t=>typeof t==='number');
  const avgTime = times.length ? times.reduce((a,b)=>a+b,0)/times.length : null;
  let timeContribution = 0;
  if(avgTime!=null && overallAvgTime && overallAvgTime>0){
    const ratio = avgTime/overallAvgTime;
    timeContribution = Math.max(0, Math.min(1, ratio-1)) * 20;
  }

  const repeatContribution = wrong >= 2 ? Math.min(1, (wrong-1)/Math.max(1,n-1)) * 15 : 0;

  const recent = list.slice(0,5);
  const recentWrong = recent.filter(a=>!a.isCorrect).length;
  const recentContribution = recent.length ? (recentWrong/recent.length) * 15 : 0;

  const score = errorContribution + timeContribution + repeatContribution + recentContribution;
  return Math.round(Math.max(0, Math.min(100, score)));
}

function struggleLabel(score){
  if(score==null) return null;
  if(score >= 70) return 'critical';
  if(score >= 45) return 'needs';
  if(score >= 20) return 'average';
  return 'strong';
}
function struggleLabelText(key){
  return { critical:'CRITICAL', needs:'NEEDS PRACTICE', average:'AVERAGE', strong:'STRONG' }[key] || 'N/A';
}

function computeMistakeStats(attempts, mistakes){
  const totalAttempts = attempts.length;
  const totalWrong = attempts.filter(a=>!a.isCorrect).length;
  const errorRate = totalAttempts ? (totalWrong/totalAttempts*100) : null;

  const byTopic = {};
  const byType = {};
  mistakes.forEach(m=>{
    byTopic[m.topic] = (byTopic[m.topic]||0)+1;
    byType[m.category] = (byType[m.category]||0)+1;
  });
  const topTopic = Object.entries(byTopic).sort((a,b)=>b[1]-a[1])[0];
  const topType = Object.entries(byType).sort((a,b)=>b[1]-a[1])[0];

  const wrongAttempts = attempts.filter(a=>!a.isCorrect);
  const wrongTimes = wrongAttempts.map(a=>a.timeTaken).filter(t=>typeof t==='number');
  const avgTimeBeforeWrong = wrongTimes.length ? wrongTimes.reduce((a,b)=>a+b,0)/wrongTimes.length : null;

  return { totalMistakes: mistakes.length, totalWrongInHistory: totalWrong, errorRate, byTopic, byType, topTopic, topType, avgTimeBeforeWrong };
}

function computeRepeatedWeakness(attempts){
  const grouped = groupByTopic(attempts);
  const out = [];
  grouped.forEach((list, topic)=>{
    const wrong = list.filter(a=>!a.isCorrect);
    if(wrong.length >= 2){
      const timed = list.filter(a=>a.timestampMs!=null).sort((a,b)=>a.timestampMs-b.timestampMs);
      const first = timed.length ? timed[0] : null;
      const last = timed.length ? timed[timed.length-1] : null;
      const firstHalf = list.slice(Math.ceil(list.length/2));
      const secondHalf = list.slice(0, Math.ceil(list.length/2));
      const improvement = (firstHalf.length && secondHalf.length)
        ? (( (secondHalf.filter(a=>a.isCorrect).length/secondHalf.length) - (firstHalf.filter(a=>a.isCorrect).length/firstHalf.length) ) * 100)
        : null;
      out.push({
        topic, occurrences: wrong.length, total: list.length,
        firstOccurrence: first ? first.dateStr : 'Unknown',
        lastOccurrence: last ? last.dateStr : 'Unknown',
        improvementPct: improvement
      });
    }
  });
  return out.sort((a,b)=>b.occurrences-a.occurrences);
}

/** Trend over time, guarded against tiny samples. */
function computeTrend(attempts){
  const timed = attempts.filter(a=>a.timestampMs!=null).sort((a,b)=>a.timestampMs-b.timestampMs);
  if(timed.length < CFG.minSampleForTrend) return { status:'insufficient', label:'Not enough data yet.' };
  const mid = Math.floor(timed.length/2);
  const firstHalf = timed.slice(0, mid);
  const secondHalf = timed.slice(mid);
  const accFirst = firstHalf.filter(a=>a.isCorrect).length/firstHalf.length*100;
  const accSecond = secondHalf.filter(a=>a.isCorrect).length/secondHalf.length*100;
  const delta = accSecond - accFirst;
  let status = 'stable';
  if(delta >= 5) status = 'improving';
  else if(delta <= -5) status = 'declining';
  return { status, delta, accFirst, accSecond, label:`${accFirst.toFixed(1)}% \u2192 ${accSecond.toFixed(1)}%` };
}

function computeHeatmap(attempts){
  const byDay = new Map();
  attempts.forEach(a=>{
    const key = a.dateStr || 'Unknown';
    if(!byDay.has(key)) byDay.set(key, { date:key, solved:0, correct:0, wrong:0, time:0 });
    const d = byDay.get(key);
    d.solved++;
    if(a.isCorrect) d.correct++; else d.wrong++;
    if(typeof a.timeTaken==='number') d.time += a.timeTaken;
  });
  return Array.from(byDay.values());
}

/** Insight generator — only emits a line when the underlying sample is
 *  large enough to say something meaningful; otherwise stays silent or
 *  says "Not enough data yet." */
function computeInsights(attempts, topicRows, trend){
  const insights = [];
  if(attempts.length < 5){
    insights.push({ tag:'Info', text:'Not enough data yet — keep solving questions to unlock insights.', level:'na' });
    return insights;
  }
  if(trend.status !== 'insufficient'){
    if(trend.status==='improving') insights.push({ tag:'Trend', text:`Accuracy improved from ${trend.accFirst.toFixed(1)}% to ${trend.accSecond.toFixed(1)}% across your loaded history.`, level:'good' });
    else if(trend.status==='declining') insights.push({ tag:'Trend', text:`Accuracy dropped from ${trend.accFirst.toFixed(1)}% to ${trend.accSecond.toFixed(1)}% across your loaded history.`, level:'warn' });
  }
  const bestTopic = topicRows.filter(t=>!t.sampleTooSmall).sort((a,b)=>(b.accuracy||0)-(a.accuracy||0))[0];
  const worstTopic = topicRows.filter(t=>!t.sampleTooSmall).sort((a,b)=>(a.accuracy||0)-(b.accuracy||0))[0];
  if(bestTopic) insights.push({ tag:'Strength', text:`You're most accurate at ${bestTopic.topic} (${bestTopic.accuracy.toFixed(1)}% over ${bestTopic.attempts} attempts).`, level:'good' });
  if(worstTopic && worstTopic.topic !== (bestTopic&&bestTopic.topic)) insights.push({ tag:'Weak spot', text:`${worstTopic.topic} has your lowest accuracy (${worstTopic.accuracy.toFixed(1)}% over ${worstTopic.attempts} attempts).`, level:'warn' });

  const timedTopics = topicRows.filter(t=>t.avgTime!=null && !t.sampleTooSmall);
  const overallTimes = attempts.map(a=>a.timeTaken).filter(t=>typeof t==='number');
  const overallAvg = overallTimes.length ? overallTimes.reduce((a,b)=>a+b,0)/overallTimes.length : null;
  if(overallAvg){
    const slowest = timedTopics.sort((a,b)=>b.avgTime-a.avgTime)[0];
    if(slowest && slowest.avgTime > overallAvg*1.2){
      const pct = Math.round((slowest.avgTime/overallAvg-1)*100);
      insights.push({ tag:'Speed', text:`You spend ${pct}% more time on ${slowest.topic} than your overall average.`, level:'warn' });
    }
  }
  if(insights.length===0) insights.push({ tag:'Info', text:'No strong patterns yet — solve more questions across topics to unlock deeper insights.', level:'na' });
  return insights;
}

/* ================================================================
   FILTER ENGINE
   ================================================================ */
function withinDateRange(a, range, custom){
  if(range==='all') return true;
  if(a.timestampMs==null) return range==='all';
  const now = Date.now();
  const day = 24*60*60*1000;
  if(range==='today'){ const d = new Date(); d.setHours(0,0,0,0); return a.timestampMs >= d.getTime(); }
  if(range==='7d') return a.timestampMs >= now-7*day;
  if(range==='30d') return a.timestampMs >= now-30*day;
  if(range==='90d') return a.timestampMs >= now-90*day;
  if(range==='custom'){
    if(custom.from && a.timestampMs < new Date(custom.from).getTime()) return false;
    if(custom.to && a.timestampMs > new Date(custom.to).getTime()+day) return false;
    return true;
  }
  return true;
}

function applyFilters(attempts){
  const f = state.filters;
  const q = (f.search||'').trim().toLowerCase();
  return attempts.filter(a=>{
    if(f.type!=='all' && a.category!==f.type) return false;
    if(f.result==='correct' && !a.isCorrect) return false;
    if(f.result==='wrong' && a.isCorrect) return false;
    if(f.topic!=='all' && a.topic!==f.topic) return false;
    if(!withinDateRange(a, f.dateRange, f.custom)) return false;
    if(q){
      const hay = `${a.question} ${a.topic} ${a.studentAnswer} ${a.correctAnswer} ${a.studentName}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

   ORCHESTRATION
   ================================================================ */
function hideAllGates(){
  $('#authGate').classList.add('hidden');
  $('#loadingGate').classList.add('hidden');
  $('#errorGate').classList.add('hidden');
  $('#tabPanels').classList.add('hidden');
}
function showErrorGate(title, msg){
  hideAllGates();
  $('#errorTitle').textContent = title || 'Something went wrong';
  $('#errorMsg').textContent = msg || 'Please try again.';
  $('#errorGate').classList.remove('hidden');
}
function showLoadingGate(msg){
  hideAllGates();
  if(msg) $('#loadingMsg').textContent = msg;
  $('#loadingGate').classList.remove('hidden');
}

async function loadInitialData(){
  showLoadingGate('Loading your Number Trainer data…');
  try{
    watchOwnDoc(state.user.uid);

    if(!state.viewedIsSelf){
      state.viewedDoc = await fetchStudentDoc(state.viewedUid);
    } else {
      // wait briefly for the first snapshot if it hasn't arrived yet
      let tries = 0;
      while(state.selfDoc===null && tries < 40){ await new Promise(r=>setTimeout(r,50)); tries++; }
      state.viewedDoc = state.selfDoc;
    }

    onViewedDocChanged();

    if(state.isAdmin) {
      await fetchStudentsPage(true);
      if (state.viewedIsSelf) state.activeTab = 'cohortAi';
    }

    hideAllGates();
    $('#tabPanels').classList.remove('hidden');
    renderTabNav();
    switchTab(state.activeTab);
  }catch(err){
    console.error(err);
    showErrorGate('Could not load analytics', err && err.message ? err.message : 'Unknown error. Check your connection and Firestore permissions.');
  }
}

function onViewedDocChanged(){
  const name = state.viewedDoc ? state.viewedDoc.name : null;
  const built = buildAttemptsForDoc(state.viewedDoc, state.viewedUid, name);
  state.attempts = built.attempts;
  state.mistakes = built.mistakes;
  state.sessions = deriveSessions(state.attempts);
  // Re-render the currently active tab in place so live updates show up
  // without a full page reload (see realtime requirement).
  if(!$('#tabPanels').classList.contains('hidden')) renderActiveTab();
}

async function selectStudent(uid, name){
  if(!state.isAdmin && uid !== state.user.uid) return; // never trust the client — Firestore rules are the real gate
  showLoadingGate(`Loading ${name||uid}…`);
  state.viewedUid = uid;
  state.viewedIsSelf = uid === state.user.uid;
  setLive(state.viewedIsSelf);
  try{
    state.viewedDoc = state.viewedIsSelf ? state.selfDoc : await fetchStudentDoc(uid);
    if(!state.viewedDoc){
      toast('No analytics data found for that student yet.', 'error');
    }
    onViewedDocChanged();
    hideAllGates();
    $('#tabPanels').classList.remove('hidden');
    const url = new URL(window.location.href);
    if(state.isAdmin && !state.viewedIsSelf) url.searchParams.set('student', uid); else url.searchParams.delete('student');
    window.history.replaceState({}, '', url);
    switchTab('overview');
  }catch(err){
    showErrorGate('Could not load that student', err.message||String(err));
  }
}

function renderTabNav(){
  const nav = $('#tabNav');
  nav.classList.remove('hidden');

  let visibleTabs = [];
  if (state.isAdmin && state.viewedIsSelf) {
    // Admin Mode (self view): only cohort AI, student roster, and topics
    visibleTabs = TABS.filter(t => t.id === 'cohortAi' || t.id === 'students' || t.id === 'topics' || t.id === 'leaderboard');
    if (!visibleTabs.some(t => t.id === state.activeTab)) {
      state.activeTab = 'cohortAi';
    }
  } else if (state.isAdmin && !state.viewedIsSelf) {
    // Admin inspecting a specific student
    visibleTabs = TABS.filter(t => t.id !== 'cohortAi' && t.id !== 'students');
  } else {
    // Normal student mode
    visibleTabs = TABS.filter(t => !t.adminOnly);
  }

  nav.innerHTML = visibleTabs.map(t=>`
    <button class="tab-btn" role="tab" id="tabbtn-${t.id}" aria-selected="${state.activeTab===t.id}" data-tab="${t.id}">${esc(t.label)}</button>
  `).join('');
  $all('.tab-btn', nav).forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });

function renderAdminStudentInspectionHeader() {

          <div style="font-weight:700; font-size:14px; color:var(--text);">Inspecting Student Record: <span style="color:var(--primary);">${esc(studentName)}</span></div>
          <div style="font-size:12px; color:var(--item-subtext, #64748b);">You are reviewing this student's individual analytics. No data is stored for your admin account.</div>
        </div>
      </div>
      <button id="backToCohortBtn" class="btn btn-secondary" style="background:var(--primary); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px;">

function switchTab(id){
  state.activeTab = id;

}

/* ================================================================
   CHART ENGINE — thin wrappers around Chart.js with shared dark theme
   ================================================================ */
const CHART_DEFAULTS = {
  color: '#94a3b8',
  gridColor: 'rgba(255,255,255,.06)'
};
function destroyChart(key){ if(state.charts[key]){ state.charts[key].destroy(); delete state.charts[key]; } }
function isChartJsReady(){ return typeof Chart !== 'undefined'; }
function chartFallback(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const box = canvas.closest('.chart-box') || canvas.parentElement;
  if(box){
    box.innerHTML = `<div class="empty-state" style="padding:14px;">
      <div class="emoji">📉</div>
      <h3 style="font-size:13px;">Chart unavailable</h3>
      <p>The Chart.js library didn't load (often an ad blocker or network filter blocking the CDN). The numbers above are still accurate — this only affects the graphic.</p>
    </div>`;
  }
}
function makeLineChart(canvasId, key, labels, datasets){
  if(!isChartJsReady()){ chartFallback(canvasId); return; }
  destroyChart(key);
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  state.charts[key] = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:CHART_DEFAULTS.color, font:{size:11} } } },
      scales:{
        x:{ ticks:{ color:CHART_DEFAULTS.color, font:{size:10}, maxRotation:0 }, grid:{ color:CHART_DEFAULTS.gridColor } },
        y:{ ticks:{ color:CHART_DEFAULTS.color, font:{size:10} }, grid:{ color:CHART_DEFAULTS.gridColor } }
      }
    }
  });
}
function makeBarChart(canvasId, key, labels, datasets, horizontal){
  if(!isChartJsReady()){ chartFallback(canvasId); return; }
  destroyChart(key);
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  state.charts[key] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets },
    options:{
      indexAxis: horizontal ? 'y' : 'x',
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display: datasets.length>1, labels:{ color:CHART_DEFAULTS.color, font:{size:11} } } },
      scales:{
        x:{ ticks:{ color:CHART_DEFAULTS.color, font:{size:10} }, grid:{ color:CHART_DEFAULTS.gridColor } },
        y:{ ticks:{ color:CHART_DEFAULTS.color, font:{size:10} }, grid:{ color:CHART_DEFAULTS.gridColor } }
      }
    }
  });
}
function makeDoughnutChart(canvasId, key, labels, data, colors){
  if(!isChartJsReady()){ chartFallback(canvasId); return; }
  destroyChart(key);
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  state.charts[key] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:0 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins:{ legend:{ position:'bottom', labels:{ color:CHART_DEFAULTS.color, font:{size:11}, boxWidth:10 } } }
    }
  });
}

function sortRows(rows, table, columns){
  const s = state.sort;
  if(s.table !== table || !s.key) return rows;
  const col = columns[s.key];
  if(!col) return rows;
  const sorted = rows.slice().sort((a,b)=>{
    const av = col(a), bv = col(b);
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    if(av<bv) return -1; if(av>bv) return 1; return 0;
  });
  if(s.dir==='desc') sorted.reverse();
  return sorted;
}
function wireSortableHeaders(wrap, table, columns, rerender){
  $all('thead th[data-key]', wrap).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(state.sort.table===table && state.sort.key===key) state.sort.dir = state.sort.dir==='desc'?'asc':'desc';
      else { state.sort.table = table; state.sort.key = key; state.sort.dir = 'desc'; }
      rerender();
    });
  });
}
function sortIndicator(table, key){
  if(state.sort.table!==table || state.sort.key!==key) return '';
  return `<span class="sort-ind">${state.sort.dir==='desc'?'▼':'▲'}</span>`;
}

function renderTimeline(){
  const panel = $('#panel-timeline');
  const attempts = state.attempts;
  if(!attempts.length){
    panel.innerHTML = `<div class="empty-state"><div class="emoji">🗓️</div><h3>No activity yet</h3><p>Your daily activity heatmap will appear here once you start solving questions.</p></div>`;
    return;
  }
  const heat = computeHeatmap(attempts);
  const maxSolved = Math.max(1, ...heat.map(h=>h.solved));

  panel.innerHTML = `
    <div class="section-title"><div><h2>Timeline &amp; Daily Activity</h2><div class="section-sub">Grouped by the date string the app stores with each attempt.</div></div></div>
    <div class="card">
      <h3 style="font-size:14px; margin-bottom:8px;">Activity Heatmap</h3>
      <div class="heatmap" id="heatmapGrid">
        ${heat.map(h=>{
          const intensity = h.solved/maxSolved;
          const alpha = 0.12 + intensity*0.75;
          return `<div class="heat-cell" data-date="${esc(h.date)}" title="${esc(h.date)}: ${h.solved} solved, ${h.correct} correct, ${h.wrong} wrong" style="background:rgba(99,102,241,${alpha.toFixed(2)});"></div>`;
        }).join('')}
      </div>
      <div class="heat-legend"><span>Less</span><div class="heat-cell" style="background:rgba(99,102,241,.12); width:11px; height:11px;"></div><div class="heat-cell" style="background:rgba(99,102,241,.5); width:11px; height:11px;"></div><div class="heat-cell" style="background:rgba(99,102,241,.87); width:11px; height:11px;"></div><span>More</span></div>
    </div>
    <div class="card">
      <div id="timelineFilterWrap">${filterBarHtml(attempts, true)}</div>
      <div id="timelineList" style="margin-top:14px; display:flex; flex-direction:column; gap:10px; max-height:600px; overflow-y:auto;"></div>
    </div>
  `;

  function updateTimelineView(){
    renderTimelineList(applyFilters(attempts));
  }

  wireFilterBar(()=>{
    if(state.filters.dateRange === 'custom') {
      const wrap = $('#timelineFilterWrap');
      if(wrap && !$('#fFrom')) {
        wrap.innerHTML = filterBarHtml(attempts, true);
        wireFilterBar(updateTimelineView);
      }
    }
    updateTimelineView();
  });

  updateTimelineView();

  $all('.heat-cell', $('#heatmapGrid')).forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const date = cell.dataset.date;
      renderTimelineList(attempts.filter(a=>(a.dateStr||'Unknown')===date));
      toast(`Showing attempts from ${date}`);
    });
  });
}
function renderTimelineList(rows){
  const el = $('#timelineList');
  if(!el) return;
  if(!rows.length){ el.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><h3>Nothing to show</h3><p>Try a different filter or day.</p></div>`; return; }

async function renderLeaderboard(){
  const panel = $('#panel-leaderboard');
  panel.innerHTML = `<div class="card"><p class="scope-note">Loading leaderboard…</p></div>`;
  try{
    let rows = [];
    if (window.NST && window.NST.fetchLeaderboard) {
      rows = await window.NST.fetchLeaderboard();
    } else {
      let snap;
      try {
        snap = await state.db.collection(CFG.collection).orderBy('points','desc').limit(20).get();
      } catch (orderErr) {
        snap = await state.db.collection(CFG.collection).limit(50).get();
      }
      rows = snap.docs.map(d=>normalizeStudentSummary(d.data(), d.id));
      rows.sort((a,b) => (b.points || 0) - (a.points || 0));
    }

    if (!rows || !rows.length) {
      panel.innerHTML = `<div class="empty-state"><div class="emoji">🏆</div><h3>No rankings yet</h3><p>Start solving questions in the Number System Trainer to earn points!</p></div>`;
      return;
    }

    panel.innerHTML = `
      <div class="section-title"><div><h2>Leaderboard</h2><div class="section-sub">All-time rankings by Digital Points across all registered learners.</div></div></div>
      <div class="card">
        <p class="scope-note" style="margin-bottom:10px;">Rankings update automatically whenever points are earned.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Rank</th><th>Student</th><th>Points</th><th>Solved</th><th>Accuracy</th><th>Best Streak</th></tr></thead>
          <tbody>${rows.map((r,i)=>{
            const isMe = state.user && (r.uid === state.user.uid || (state.user.email && r.email === state.user.email));
            return `<tr${isMe?' style="background:rgba(99,102,241,0.18); font-weight:bold;"':''}>
            <td><span class="mono" style="font-weight:800; ${i<3?`color:${i===0?'#fbbf24':i===1?'#94a3b8':'#d97706'};`:''}">#${i+1}</span></td>
            <td>${esc(r.name)}${isMe ? ' <em style="color:#a5b4fc; font-size:12px;">(You)</em>' : ''}</td>
            <td class="mono">${fmtNum(r.points)}</td><td class="mono">${fmtNum(r.totalSolved)}</td>
            <td>${r.accuracy==null?'N/A':fmtPct(r.accuracy)}</td><td class="mono">${fmtNum(r.maxStreak)}</td>
          </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>
    `;
  }catch(err){
    panel.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><h3>Couldn't load the leaderboard</h3><p>${esc(err.message||String(err))}</p></div>`;
  }
}

      })
    });

    const contentType = res.headers.get('content-type') || '';
    if (res.ok && contentType.includes('application/json')) {

      if (data && data.success && data.report) {
        report = data.report;
      }
    }
  } catch (e) {
    console.warn("Local /api/analyze-performance endpoint unavailable, falling back:", e);
  }

  // 2. Fallback to Cloudflare Worker Proxy if report not generated yet
  if (!report) {
    try {

        `Q: ${m.a || m.question || ''} ${m.op || ''} ${m.b || ''} (Base ${m.base || ''}) | User: "${m.userAnswer || m.userVal || ''}" vs Correct: "${m.correctAnswer || m.answer || ''}"`

Analyze this student's performance statistics and respond STRICTLY in JSON format without markdown code blocks.

Respond with JSON matching this structure exactly:

function generateLocalDiagnosticReport(stats, history, mistakes) {
  const accuracy = stats.accuracy != null ? stats.accuracy : 0;
  let grade = 'C';
  if (accuracy >= 95) grade = 'A+';
  else if (accuracy >= 85) grade = 'A';
  else if (accuracy >= 70) grade = 'B';
  else if (accuracy >= 55) grade = 'C';
  else if (accuracy >= 40) grade = 'D';
  else grade = 'F';

  const total = (stats.arithmetic || 0) + (stats.conversions || 0);

  const strengths = [];
  const areas = [];

  if ((stats.arithmetic || 0) > 0) {
    strengths.push(`Completed ${stats.arithmetic} multi-digit binary & inter-base arithmetic exercises with column precision.`);
  }
  if ((stats.conversions || 0) > 0) {
    strengths.push(`Successfully executed ${stats.conversions} positional number system conversions across binary, octal, and hex.`);
  }

  if (accuracy >= 80) {
    strengths.push(`Maintained a high ${accuracy.toFixed(1)}% accuracy rate, proving strong mastery of carry/borrow logic.`);
  } else {
    areas.push(`Current accuracy is ${accuracy.toFixed(1)}%. Focus on double-checking intermediate digit sums before submitting.`);
  }

  if (stats.maxStreak >= 5) {
    strengths.push(`Sustained a peak streak of ${stats.maxStreak} consecutive correct answers under timed practice.`);
  } else {
    areas.push(`Work on extending your consistency streak beyond ${stats.maxStreak || 0} consecutive correct answers.`);
  }

  if (mistakes && mistakes.length > 0) {
    areas.push(`Found ${mistakes.length} error entry(s) in your notebook. Review intermediate carry steps to prevent recurrence.`);
  }

  if (strengths.length === 0) strengths.push('Building fundamental knowledge in positional number notation.');
  if (areas.length === 0) areas.push('Maintain current pace and challenge yourself with 16-bit or 32-bit speed drills.');

  return {
    grade,
    summary: `Student has completed ${total} practice exercises with an overall accuracy of ${accuracy.toFixed(1)}% and a peak streak of ${stats.maxStreak || 0} consecutive correct solutions across multi-base arithmetic and conversions.`,
    strengths,
    areasForImprovement: areas,
    mistakePatternAnalysis: {
      sillyMistakes: (mistakes && mistakes.length > 0)
        ? `Analyzed ${mistakes.length} error record(s). Discrepancies primarily occur in off-by-one trailing bits or fast arithmetic entries.`
        : 'Zero active mistake logs; exceptional calculation precision across active sessions.',
      conceptualFlaws: accuracy < 70
        ? 'Targeted practice recommended for fractional base multiplication and 4-bit nibble hex grouping.'
        : 'Solid conceptual understanding of positional place values and binary carry/borrow propagation.',
      speedVsAccuracy: accuracy >= 80
        ? 'Ideal balance between response speed and precision. Pacing remains stable as problem capacity increases.'
        : 'Pacing is slightly fast relative to accuracy. Pausing 2 seconds to verify carry propagation will boost accuracy.'
    },
    actionableTips: [
      'Practice grouping binary bits into 4-bit nibbles for instant Hexadecimal conversion.',
      'Double-check intermediate carry digits in 8-bit and 16-bit binary addition.',
      'Review logged notebook mistakes immediately after each practice session to reinforce logic.'
    ]
  };
}
