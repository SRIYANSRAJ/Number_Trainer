async function fetchGeminiCohortAnalysis(){
  const btn = $('#genCohortAiBtn');
  if(btn){ btn.disabled = true; btn.textContent = '✨ Gemini AI Analyzing Cohort…'; }

  const container = $('#cohortAiContent');
  if(container){
    container.innerHTML = `
      <div class="ai-loading-pane">
        <div class="ai-loading-pulse">✨</div>
        <h3 style="font-size:18px; color:var(--text); margin:0;">Synthesizing Class Cohort Analytics with Gemini AI...</h3>
        <p style="font-size:13px; color:var(--muted); margin:0;">Extracting accuracy metrics, carry/borrow flaws, response times, and mistake patterns across ${state.students.length} students...</p>
        <div class="ai-loading-bar-wrap">
          <div class="ai-loading-bar-fill"></div>
        </div>
      </div>
    `;
  }

  // 1. Gather cohort metrics across loaded students and Firestore userStats
  const totalStudents = state.students ? state.students.length : 1;
  let totalSolved = 0;
  let pointsSum = 0;
  let accSum = 0;
  let highP = 0, modP = 0, strugP = 0;

  const mistakesList = [];
  const topicStatsMap = {};

  (state.students || []).forEach(s => {
    const solved = s.totalSolved || 0;
    const pts = s.points || 0;
    const acc = s.accuracy || 0;
    totalSolved += solved;
    pointsSum += pts;
    accSum += acc;

    if(acc >= 80) highP++;
    else if(acc >= 50) modP++;
    else strugP++;
  });

  const avgAcc = totalStudents > 0 ? (accSum / totalStudents) : 0;
  const avgPts = totalStudents > 0 ? Math.round(pointsSum / totalStudents) : 0;

  // Gather attempts from state.attempts or active student doc
  const attempts = state.attempts || [];
  attempts.forEach(a => {
    if(!topicStatsMap[a.topic]){
      topicStatsMap[a.topic] = { topic: a.topic, total: 0, correct: 0, totalTime: 0 };
    }
    topicStatsMap[a.topic].total++;
    if(a.isCorrect) topicStatsMap[a.topic].correct++;
    if(a.timeTaken) topicStatsMap[a.topic].totalTime += a.timeTaken;

    if(!a.isCorrect){
      mistakesList.push({
        topic: a.topic,
        question: a.question,
        studentAnswer: a.studentAnswer,
        correctAnswer: a.correctAnswer,
        timeTaken: a.timeTaken
      });
    }
  });

  const topicBreakdown = Object.values(topicStatsMap).map(t => ({
    topic: t.topic,
    accuracy: t.total > 0 ? +((t.correct / t.total) * 100).toFixed(1) : 0,
    totalAttempted: t.total,
    avgTimeSec: t.total > 0 ? +(t.totalTime / t.total).toFixed(1) : 0
  }));

  const cohortData = {
    totalStudents: Math.max(totalStudents, 1),
    totalQuestionsSolved: Math.max(totalSolved, attempts.length),
    classAverageAccuracy: +avgAcc.toFixed(1),
    classAveragePoints: avgPts,
    performanceDistribution: {
      highPerformers: highP,
      moderatePerformers: modP,
      strugglingStudents: strugP
    },
    topicBreakdown,
    commonMistakes: mistakesList.slice(0, 25),
    timePacingMetrics: {
      avgResponseTimeSec: attempts.length ? +(attempts.reduce((a,b)=>a+(b.timeTaken||0),0)/attempts.length).toFixed(1) : 4.5,
      slowestCategory: topicBreakdown.length ? [...topicBreakdown].sort((a,b)=>b.avgTimeSec-a.avgTimeSec)[0]?.topic || 'Hexadecimal Arithmetic' : 'Binary Arithmetic'
    }
  };

  let report = null;

  try {
    const res = await fetch('/api/analyze-cohort', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cohortData })
    });
    if(res.ok){
      const data = await res.json();
      if(data.success && data.report){
        report = data.report;
      }
    }
  } catch(e) {
    console.warn("Cohort API endpoint call failed, using local diagnostic synthesis engine:", e);
  }

  // Fallback to local cohort diagnostic engine if backend fails or API key missing
  if(!report){
    report = generateLocalCohortReport(cohortData);
  }

  cohortAiCache = { report, data: cohortData };
  renderCohortAiReportView(report, cohortData);

  if(btn){ btn.disabled = false; btn.textContent = '✨ Re-analyze Cohort'; }
}

function generateLocalCohortReport(d){
  const acc = d.classAverageAccuracy;
  let grade = 'B';
  if(acc >= 90) grade = 'A+';
  else if(acc >= 80) grade = 'A';
  else if(acc >= 70) grade = 'B';
  else if(acc >= 60) grade = 'C';
  else if(acc >= 50) grade = 'D';
  else grade = 'F';

  const slowest = d.timePacingMetrics?.slowestCategory || 'Arithmetic Base Operations';
  const strugCount = d.performanceDistribution?.strugglingStudents || 0;

  return {
    healthGrade: grade,
    executiveSummary: `The class cohort of ${d.totalStudents} student(s) has solved a total of ${fmtNum(d.totalQuestionsSolved)} questions with a class-wide average accuracy of ${acc.toFixed(1)}%. Overall participation is strong, with ${d.performanceDistribution.highPerformers} student(s) demonstrating high mastery and ${strugCount} student(s) requiring targeted instructional intervention.`,
    topStrugglingAreas: [
      `Positional Fractional Conversions (Hexadecimal & Octal fraction bits)`,
      `Carry & Borrow propagation in Multi-bit Binary Arithmetic`,
      `2's Complement Sign Extension & Negative Number Bit Flips`
    ],
    commonLogicFlaws: [
      `Off-by-One Bit Shift Errors: Students frequently drop trailing zeros during binary-to-hexadecimal 4-bit nibble grouping.`,
      `Borrow Confusion in Binary Subtraction: High error rate when borrowing across multiple consecutive zero bits (e.g. 1000 - 1).`,
      `Hexadecimal Letter Value Mapping: Confusion between D (13), E (14), and F (15) during rapid mental calculations.`
    ],
    pacingAndTimeBottlenecks: `Average response speed across all attempts is approximately ${d.timePacingMetrics.avgResponseTimeSec}s per problem. Response times spike significantly in ${slowest}, indicating students are spending additional cognitive effort recalculating intermediate positional powers.`,
    commonMistakesBreakdown: [
      `Misaligning 3-bit octal / 4-bit hex nibble boundaries during direct conversions.`,
      `Forgetting to invert bits (+1) during 2's complement negation steps.`,
      `Rushed entry typos on long 16-bit binary sequences under timed quiz conditions.`
    ],
    pedagogicalRecommendations: [
      `Conduct a dedicated mini-lecture on Nibble Grouping (4 bits = 1 Hex digit) with visual color-coded bit boxes.`,
      `Assign speed drills on Binary Borrowing across consecutive zeroes (e.g., 1000₂ - 1₂).`,
      `Provide students needing intervention with step-by-step AI practice mode to build confidence.`
    ]
  };
}

/* ================================================================
   UI RENDERING — REPORTS (export + printable student report)
   ================================================================ */
function renderReports(){
  const panel = $('#panel-reports');
  const summary = state.viewedDoc ? normalizeStudentSummary(state.viewedDoc, state.viewedUid) : null;
  if(!summary){
    panel.innerHTML = `<div class="empty-state"><div class="emoji">📄</div><h3>No data to report yet</h3></div>`;
    return;
  }
  const kpis = computeSelfKPIs(summary, state.attempts);
  const topicRows = computeTopicTable(state.attempts);
  const strengths = topicRows.filter(t=>!t.sampleTooSmall).sort((a,b)=>(b.accuracy||0)-(a.accuracy||0)).slice(0,3);
  const weaknesses = topicRows.filter(t=>!t.sampleTooSmall).sort((a,b)=>(a.accuracy||0)-(b.accuracy||0)).slice(0,3);
  const topMistakes = state.mistakes.slice(0,8);

  panel.innerHTML = `
    <div class="section-title"><div><h2>Reports</h2><div class="section-sub">Export data or generate a printable report for ${esc(summary.name)}.</div></div></div>
    <div class="card">
      <h3 style="font-size:14px; margin-bottom:10px;">Export</h3>
      <div class="btn-row">
        <button class="btn ghost" id="repExportHistoryCsv">Question History (CSV)</button>
        <button class="btn ghost" id="repExportHistoryJson">Question History (JSON)</button>
        <button class="btn ghost" id="repExportMistakesCsv">Mistakes (CSV)</button>
        <button class="btn ghost" id="repExportTopicsCsv">Topic Performance (CSV)</button>
        <button class="btn ghost" id="repExportSessionsJson">Sessions (JSON)</button>
        <button class="btn gold" id="repPrintBtn">🖨 Print Full Report</button>
      </div>
      <p class="scope-note" style="margin-top:10px;">Exports are limited to data the signed-in account is authorized to read — the current student's own record${state.isAdmin?' (or any student you can view as admin)':''}.</p>
    </div>

    <div class="card" id="printReportCard">
      <div style="text-align:center; margin-bottom:16px;">
        <div style="font-weight:800; letter-spacing:1px; font-size:13px; color:var(--primary);">NUMBER TRAINER</div>
        <h2 style="font-size:20px; margin-top:4px;">Student Performance Report</h2>
      </div>
      <div class="detail-grid" style="margin-bottom:16px;">
        <div><div class="detail-k">Student</div><div class="detail-v">${esc(summary.name)}</div></div>
        <div><div class="detail-k">Date Generated</div><div class="detail-v">${new Date().toLocaleString()}</div></div>
        <div><div class="detail-k">Total Questions (loaded)</div><div class="detail-v">${fmtNum(kpis.totalSolved)}</div></div>
        <div><div class="detail-k">Accuracy</div><div class="detail-v">${fmtPct(kpis.accuracy)}</div></div>
        <div><div class="detail-k">Points</div><div class="detail-v">${fmtNum(kpis.points)}</div></div>
        <div><div class="detail-k">Best Streak</div><div class="detail-v">${fmtNum(kpis.maxStreak)}</div></div>
      </div>

      <h3 style="font-size:13.5px; margin:14px 0 6px;">Top Strengths</h3>
      ${strengths.length ? `<ul style="margin:0 0 0 18px; font-size:12.8px; line-height:1.7;">${strengths.map(s=>`<li>${esc(s.topic)} — ${fmtPct(s.accuracy)} accuracy over ${s.attempts} attempts</li>`).join('')}</ul>` : `<p class="scope-note">Not enough data yet.</p>`}

      <h3 style="font-size:13.5px; margin:14px 0 6px;">Weak Areas</h3>
      ${weaknesses.length ? `<ul style="margin:0 0 0 18px; font-size:12.8px; line-height:1.7;">${weaknesses.map(s=>`<li>${esc(s.topic)} — ${fmtPct(s.accuracy)} accuracy over ${s.attempts} attempts${s.struggleScore!=null?` (Struggle Score ${s.struggleScore}/100)`:''}</li>`).join('')}</ul>` : `<p class="scope-note">Not enough data yet.</p>`}

      <h3 style="font-size:13.5px; margin:14px 0 6px;">Top Mistakes</h3>
      ${topMistakes.length ? `<ul style="margin:0 0 0 18px; font-size:12.8px; line-height:1.7;">${topMistakes.map(m=>`<li>${esc(m.topic)}: ${esc(m.question)} — answered ${esc(m.studentAnswer)}, correct was ${esc(m.correctAnswer)}</li>`).join('')}</ul>` : `<p class="scope-note">No mistakes recorded.</p>`}

      <h3 style="font-size:13.5px; margin:14px 0 6px;">Recommended Practice Areas</h3>
      ${weaknesses.length ? `<p style="font-size:12.8px; line-height:1.6;">Based on accuracy and struggle score, focused practice on <b>${esc(weaknesses.map(w=>w.topic).join(', '))}</b> is likely to have the biggest impact.</p>` : `<p class="scope-note">Not enough data yet to recommend focus areas.</p>`}
    </div>
  `;

  $('#repExportHistoryCsv').addEventListener('click', ()=> exportRowsCSV(state.attempts, [
    {label:'Date', get:r=>r.dateStr||''}, {label:'Time', get:r=>r.timeStr||''}, {label:'Topic', get:r=>r.topic},
    {label:'Question', get:r=>r.question}, {label:'Answer', get:r=>r.studentAnswer}, {label:'Correct', get:r=>r.correctAnswer},
    {label:'Result', get:r=>r.isCorrect?'CORRECT':'WRONG'}, {label:'Time (s)', get:r=>r.timeTaken==null?'':r.timeTaken}
  ], `${summary.name}-history.csv`));
  $('#repExportHistoryJson').addEventListener('click', ()=> exportRowsJSON(state.attempts, `${summary.name}-history.json`));
  $('#repExportMistakesCsv').addEventListener('click', ()=> exportRowsCSV(state.mistakes, [
    {label:'Topic', get:r=>r.topic}, {label:'Question', get:r=>r.question}, {label:'Answer', get:r=>r.studentAnswer}, {label:'Correct', get:r=>r.correctAnswer}
  ], `${summary.name}-mistakes.csv`));
  $('#repExportTopicsCsv').addEventListener('click', ()=> exportRowsCSV(topicRows, [
    {label:'Topic', get:r=>r.topic}, {label:'Attempts', get:r=>r.attempts}, {label:'Accuracy %', get:r=>r.accuracy==null?'':r.accuracy.toFixed(1)},
    {label:'Struggle Score', get:r=>r.sampleTooSmall?'':r.struggleScore}
  ], `${summary.name}-topics.csv`));
  $('#repExportSessionsJson').addEventListener('click', ()=> exportRowsJSON(state.sessions, `${summary.name}-sessions.json`));
  $('#repPrintBtn').addEventListener('click', ()=> window.print());
}

/* ================================================================
   TOP-LEVEL EVENT HANDLERS
   ================================================================ */
$('#refreshBtn').addEventListener('click', async ()=>{
  toast('Refreshing…');
  try{
    if(!state.viewedIsSelf) state.viewedDoc = await fetchStudentDoc(state.viewedUid);
    if(state.isAdmin && state.activeTab==='students') await fetchStudentsPage(true);
    onViewedDocChanged();
    renderActiveTab();
    toast('Up to date.', 'success');
  }catch(err){ toast('Refresh failed: '+(err.message||err), 'error'); }
});
$('#signOutBtn').addEventListener('click', signOut);
$('#errorRetryBtn').addEventListener('click', ()=>{ if(state.user) loadInitialData(); else bootstrap(); });

/* ================================================================
   BOOTSTRAP
   ================================================================ */
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
</script>

</html>
